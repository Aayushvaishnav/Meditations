name: Publish verified release

on:
  workflow_run:
    workflows: ["Release (Linux)"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'app-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify built tag and packages, then publish
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const tag = run.head_branch;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            let object = ref.data.object;
            while (object.type === 'tag') {
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
              object = annotated.data.object;
            }
            if (object.type !== 'commit' || object.sha !== run.head_sha) {
              throw new Error('Release tag does not match the successful build');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length !== 1) {
              throw new Error(`Expected one release for ${tag}; found ${matches.length}`);
            }
            const release = matches[0];
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id,
            });
            for (const suffix of ['.AppImage', '.deb', '.rpm']) {
              if (!assets.some(asset => asset.name.endsWith(suffix) && asset.size > 0 && asset.state === 'uploaded')) {
                throw new Error(`Missing completed ${suffix} package`);
              }
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: 'true',
            });
            core.info(`Published ${release.html_url}`);
