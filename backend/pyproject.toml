[project]
name = "journal-backend"
version = "0.1.0"
description = "Local-first journal, tasks and AI life-OS backend (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pydantic-ai>=1.0.0",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.8.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
